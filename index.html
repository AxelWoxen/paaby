<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hyperlokalt oppdagelsesverktøy for Oslo. Finn noe å gjøre i kveld." />
  <title>påby — oslo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variabler.css" />
  <link rel="stylesheet" href="css/stil.css" />
</head>

<body>

  <!-- ==============================
       TOPBAR — slank, kun logo + tagline + hjerte
       Filtrene er flyttet ut herfra.
       ============================== -->
  <div class="topbar">
    <header class="topptekst topbar-innhold">

      <div class="logo" aria-label="påby">
        p<span class="logo-aa" aria-hidden="true">
          a
          <svg class="logo-pin" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
        </span>by
      </div>

      <p class="tagline">påby skal føles som den ene kompisen som alltid vet hva som skjer</p>

      <button id="vis-lagret" class="lagret-knapp" aria-label="Vis lagrede eventer" aria-pressed="false">
        ♡
      </button>
    </header>
  </div>


  <!-- ==============================
       HOVEDDEL
       Mobil:   én kolonne (sidestolpe over feedkolonne)
       Desktop: to kolonner (sidestolpe til venstre, feed til høyre)
       ============================== -->
  <div class="hoveddel">

    <!-- Venstre kolonne / mobil-topp: filtre -->
    <aside class="sidestolpe" aria-label="Filtre">
      <nav class="filtre" aria-label="Filtrer eventer">

        <div class="filter-gruppe">
          <span class="filter-etikett" aria-hidden="true">Type</span>
          <div class="filter-chips" role="group" aria-label="Kategori">
            <button class="chip" data-filter="kategori" data-verdi="musikk">Musikk</button>
            <button class="chip" data-filter="kategori" data-verdi="mat">Mat</button>
            <button class="chip" data-filter="kategori" data-verdi="klubb">Klubb</button>
          </div>
        </div>

        <div class="filter-gruppe">
          <span class="filter-etikett" aria-hidden="true">Tid</span>
          <div class="filter-chips" role="group" aria-label="Tidspunkt">
            <button class="chip" data-filter="tid" data-verdi="i-kveld">I kveld</button>
            <button class="chip" data-filter="tid" data-verdi="i-helga">I helga</button>
          </div>
        </div>

        <div class="filter-gruppe">
          <span class="filter-etikett" aria-hidden="true">Pris</span>
          <div class="filter-chips" role="group" aria-label="Pris">
            <button class="chip" data-filter="pris" data-verdi="gratis">Gratis</button>
            <button class="chip" data-filter="pris" data-verdi="under-200">Under 200</button>
            <button class="chip" data-filter="pris" data-verdi="over-200">200 kr+</button>
          </div>
        </div>

        <!-- 
        <div class="filter-bunn-rad">
          <span class="filter-etikett" aria-hidden="true">Lokasjon</span>
          <button class="chip" data-filter="naerhet" data-verdi="nærheten">I nærheten</button>
        </div>
        -->
      </nav>
      <button id="nullstill-knapp" class="nullstill-knapp skjult" aria-label="Nullstill alle filtre">
            Nullstill
          </button>
    </aside>


    <!-- Høyre kolonne / mobil-bunn: feed -->
    <div class="feedkolonne">

      <div class="treff-linje">
        <span id="treff-teller" aria-live="polite">henter hva som skjer...</span>
        <button id="vis-alle" class="tilbake-knapp skjult" aria-label="Tilbake til alle eventer">
          ← alle eventer
        </button>
      </div>

      <main id="feed" class="feed" aria-label="Event-feed">
        <p class="laster">henter hva som skjer...</p>
      </main>

    </div>

  </div>


  <!-- ==============================
       KART-VISNING (valgfritt)
       ============================== -->
  <section id="kart-visning" class="skjult" aria-label="Kartvisning" style="
    position: fixed; inset: 0; z-index: 50;
    background: var(--ink);
    display: flex; flex-direction: column;
  ">
    <div style="padding: var(--gap-m); display: flex; justify-content: space-between; align-items: center;">
      <span style="font-family: var(--font-tittel); font-weight: 600;">kart</span>
      <button id="lukk-kart" class="knapp-ghost">× lukk</button>
    </div>
    <div id="kart-container" style="flex: 1;"></div>
  </section>


  <!-- ==============================
       MODAL (detaljvisning)
       ============================== -->
  <div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="modal-overskrift"
  >
    <div class="modal-container">
      <button id="modal-lukk" class="modal-lukk" aria-label="Lukk">×</button>
      <div id="modal-innhold" class="modal-innhold"></div>
    </div>
  </div>


  <script type="module" src="js/main.js"></script>

</body>
</html>
