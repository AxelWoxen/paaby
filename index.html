<!DOCTYPE html>
<!-- data-palette: "a" (varm, standard) | "b" (lavendel) | "c" (oransje).
     Se css/variabler.css for hva hver palett faktisk setter. -->
<html lang="no" data-palette="a">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>påby</title>
  <meta name="description" content="Håndplukkede konserter, påfunn og klubbkvelder i Oslo." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://paaby.no" />
  <meta name="theme-color" content="#141318" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://paaby.no" />
  <meta property="og:title"       content="påby – det du ellers hadde gått glipp av" />
  <meta property="og:description" content="Finn håndplukkede konserter, påfun og klubbkvelder i Oslo." />
  <meta property="og:image"       content="https://paaby.no/bilder/paaby-logo.svg" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="påby – det du ellers hadde gått glipp av" />
  <meta name="twitter:description" content="Finn håndplukkede konserter, påfunn og klubbkvelder i Oslo." />
  <meta name="twitter:image"       content="https://paaby.no/bilder/paaby-logo.svg" />

  <link rel="icon" type="image/png" href="bilder/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variabler.css" />
  <link rel="stylesheet" href="css/stil.css" />

  <!-- ==============================
       ANALYSE-SCRIPT — Umami (cookieless, gratis opptil 100k hendelser/mnd
       på cloud.umami.is, ingen kredittkort). Slik finner du Website ID:

         1. Opprett konto på https://cloud.umami.is (eller bruk en
            selvhostet Umami-instans du allerede har).
         2. Legg til paaby.no som nettsted (Websites → Add website).
         3. Åpne nettstedet → Edit → "Tracking code" — Website ID-en står
            der, og i script-taggen Umami viser deg.
         4. Sett Website ID-en inn i data-website-id under, i stedet for
            "SETT-INN-WEBSITE-ID-HER".

       Selvhostet Umami: bytt src til https://din-instans.no/script.js.

       Se js/application/sporing.js for hvordan trackEvent() bruker denne.
       ============================== -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="da8bf02b-0671-4e3c-afb6-255a4afeb357"></script>
  <script>
    window.__paaby_track = (navn, data) => window.umami?.track(navn, data);
  </script>
</head>

<body>

  <!-- ==============================
       TOPBAR — slank, kun logo + tagline + hjerte
       Filtrene er i hoveddelen nedenfor.
       ============================== -->
  <div class="topbar">
    <header class="topptekst topbar-innhold">

      <div class="logo-lockup" aria-label="påby">
        <!-- Merket (ikonet) midlertidig fjernet — bare ordmerket vises nå.
             Legg til igjen ved å fjerne kommentaren under. -->
        <!-- <img class="logo-merke" src="bilder/paaby-merke-lys.png" alt="" /> -->
        <img class="logo-hovedlogo" src="bilder/paaby-logo.svg" alt="" />
      </div>

      <p class="tagline">Det du ellers hadde gått glipp av</p>

      <!-- Skjult i topbaren — funksjonaliteten ligger nå i hamburgermenyen
           (.meny-dropdown under). Knappene/JS-en (main.js) beholdes urørt,
           siden menyen trigger dem direkte i stedet for å duplisere
           tilstandslogikk. -->
      <button id="vis-følger" class="følger-topbar-knapp" aria-label="Vis fulgte steder" aria-pressed="false">Følger</button>

      <button id="vis-lagret" class="lagret-knapp" aria-label="Vis lagrede arrangementer" aria-pressed="false">
        <svg class="binders-ikon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Hamburgermeny — se css/stil.css («HAMBURGERMENY») og js/main.js
           (initMeny()) for oppførsel. Ikonet er bilder/Vector.svg, inlinet
           her (fill byttet til currentColor) slik at det følger appens
           egne tekstfarger i stedet for en hardkodet farge fra filen. -->
      <div class="meny-dropdown">
        <button type="button" id="meny-knapp" class="meny-knapp" aria-haspopup="true" aria-expanded="false" aria-controls="meny-panel" aria-label="Meny">
          <svg class="meny-ikon" viewBox="0 0 106 81" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M0 1.99849V79.0015C0 80.1104 0.763777 81 1.6927 81H104.307C105.247 81 106 80.0982 106 79.0015V1.99849C106 0.889573 105.236 0 104.307 0H1.6927C0.753456 0 0 0.901759 0 1.99849ZM18.7538 14.5378H87.2461C90.7967 14.5378 93.6763 17.9377 93.6763 22.1297V25.8098C93.6763 30.0018 90.7967 33.4017 87.2461 33.4017H18.7538C15.2033 33.4017 12.3237 30.0018 12.3237 25.8098V22.1297C12.3237 17.9377 15.2033 14.5378 18.7538 14.5378ZM12.3237 58.8581V55.0439C12.3237 50.852 15.2033 47.4521 18.7538 47.4521H87.2461C90.7967 47.4521 93.6763 50.852 93.6763 55.0439V58.8581C93.6763 63.0501 90.7967 66.45 87.2461 66.45H18.7538C15.2033 66.45 12.3237 63.0501 12.3237 58.8581Z" fill="currentColor"/>
          </svg>
        </button>
        <div id="meny-panel" class="meny-panel" role="menu">
          <button type="button" id="meny-folger" class="meny-lenke" role="menuitem">Følger</button>
          <button type="button" id="meny-lagret" class="meny-lenke" role="menuitem">Lagret</button>
          <hr class="meny-skille" role="separator" />
          <a href="/om/" class="meny-lenke" role="menuitem">Om Påby</a>
        </div>
      </div>
    </header>
  </div>


  <!-- ==============================
       FORSIDE — redaksjonelt utvalg
       ============================== -->
  <div id="forside" class="forside">
    <div class="forside-innhold">
      <h1 id="forside-tittel" class="forside-tittel">…</h1>
      <p  id="forside-undertittel" class="forside-undertittel"></p>
      <div id="forside-utvalg" class="forside-utvalg"></div>
    </div>
  </div>


  <!-- ==============================
       HOVEDDEL
       Mobil:   én kolonne (filtre over feed)
       Desktop: to kolonner (filtre til venstre, feed til høyre)
       ============================== -->
  <div class="hoveddel" id="hoveddel">

    <!-- Venstre kolonne / mobil-topp: filtre -->
    <aside class="sidestolpe" aria-label="Filtre">

      <!-- Kun mobil (< 900px, se css/stil.css): åpner/lukker filter-innhold
           under. Skjult med CSS på desktop, hvor filtrene alltid vises. -->
      <button
        id="filter-toggle-knapp"
        class="filter-toggle-knapp"
        type="button"
        aria-expanded="false"
        aria-controls="filter-innhold"
      >
        Filter
        <svg class="filter-toggle-pil" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="filter-innhold" class="filter-innhold">

        <nav class="filtre" aria-label="Filtrer arrangementer">

          <div class="filter-gruppe">
            <span class="filter-etikett" aria-hidden="true">Type</span>
            <div class="filter-chips" role="group" aria-label="Kategori">
              <button class="chip" data-filter="kategori" data-verdi="musikk">Musikk</button>
              <button class="chip" data-filter="kategori" data-verdi="klubb">Klubb</button>
              <button class="chip" data-filter="kategori" data-verdi="pafunn">Påfunn</button>
            </div>
          </div>

          <div class="filter-gruppe">
            <span class="filter-etikett" aria-hidden="true">Tid</span>
            <div class="filter-chips" role="group" aria-label="Tidspunkt">
              <button class="chip" data-filter="tid" data-verdi="i-kveld" aria-pressed="false">I kveld</button>
              <button class="chip" data-filter="tid" data-verdi="i-helga" aria-pressed="false">I helga</button>
            </div>
          </div>

          <div class="filter-gruppe">
            <span class="filter-etikett" aria-hidden="true">Pris</span>
            <div class="filter-chips" role="group" aria-label="Pris">
              <button class="chip" data-filter="pris" data-verdi="gratis"    aria-pressed="false">Gratis</button>
              <button class="chip" data-filter="pris" data-verdi="under-200" aria-pressed="false">Under 200</button>
              <button class="chip" data-filter="pris" data-verdi="over-200"  aria-pressed="false">200 kr+</button>
            </div>
          </div>

        </nav>

        <div class="filter-bunn-rad">
          <button
            id="vis-avstand"
            class="chip"
            aria-pressed="false"
            aria-label="Vis avstand til arrangementer"
          >Vis avstand</button>
          <button id="nullstill-knapp" class="nullstill-knapp skjult" aria-label="Nullstill alle filtre">
            Nullstill
          </button>
        </div>

        <p id="posisjon-status" class="posisjon-status skjult" aria-live="polite" aria-atomic="true"></p>

      </div>

    </aside>


    <!-- Høyre kolonne / mobil-bunn: feed -->
    <div class="feedkolonne">

      <div class="treff-linje">
        <span id="treff-teller" aria-live="polite">henter hva som skjer...</span>
        <button id="vis-alle" class="tilbake-knapp skjult" aria-label="Tilbake til alle arrangementer">
          ← alle arrangementer
        </button>
        <div class="sortering-kontroll">
          <label for="sortering" class="sortering-label">Sorter</label>
          <select id="sortering" class="sortering-select" aria-label="Sorter arrangementer">
            <option value="tid-stigende">Dato: tidlig-senere</option>
            <option value="tid-synkende">Dato: senere-tidlig</option>
            <option value="pris-stigende">Pris: lav til høy</option>
            <option value="pris-synkende">Pris: høy til lav</option>
            <option value="avstand-stigende">Nærmest</option>
          </select>
        </div>
      </div>

      <div id="uke-nav" class="uke-nav skjult">
        <button id="uke-forrige" class="uke-knapp skjult" aria-label="Forrige uke">← Forrige uke</button>
        <span id="uke-label" class="uke-label" aria-live="polite">Denne uka</span>
        <button id="uke-neste" class="uke-knapp" aria-label="Neste uke">Neste uke →</button>
      </div>

      <p id="lagret-info" class="lagret-info skjult" aria-live="polite">
        Lagres på denne enheten – dukker ikke opp på andre.
      </p>

      <main id="feed" class="feed" aria-label="Arrangement-feed">
        <p class="laster">henter hva som skjer...</p>
      </main>

    </div>

  </div>


  <!-- ==============================
       MODAL (detaljvisning)
       ============================== -->
  <div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="modal-overskrift"
  >
    <div class="modal-container">
      <div class="modal-drahandtak" aria-hidden="true"></div>
      <button id="modal-lukk" class="modal-lukk" aria-label="Lukk">×</button>
      <div id="modal-innhold" class="modal-innhold"></div>
    </div>
  </div>


  <!-- Samtykke-stripe — vises av main.js hvis brukeren ikke har svart ennå -->
  <div id="samtykke-stripe" class="samtykke-stripe skjult" role="region" aria-label="Informasjon om statistikk">
    <p class="samtykke-tekst">Vi bruker anonym statistikk for å forbedre påby. Les mer i <a href="personvern.html">personvernerklæringen</a>.</p>
    <button id="samtykke-ok" class="samtykke-knapp">Ok</button>
  </div>


  <!-- ==============================
       BUNN-NAV — kun mobil (< 900px), se css/stil.css.
       Speiler eksisterende tilstand (vis-følger / vis-lagret) —
       egen logikk finnes i js/main.js (initBunnNav).
       ============================== -->
  <nav class="bunn-nav" aria-label="Hovednavigasjon">
    <button id="bunn-forside" class="bunn-nav-knapp aktiv" aria-current="page">
      <svg class="bunn-nav-ikon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Forside</span>
    </button>
    <button id="bunn-utforsk" class="bunn-nav-knapp" aria-current="false">
      <svg class="bunn-nav-ikon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="3" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Utforsk</span>
    </button>
    <button id="bunn-folger" class="bunn-nav-knapp" aria-current="false">
      <svg class="bunn-nav-ikon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="2"/>
        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 4.5a3 3 0 0 1 0 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 14.5c2 .6 3.5 2.4 3.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Følger</span>
    </button>
    <button id="bunn-lagret" class="bunn-nav-knapp" aria-current="false">
      <svg class="bunn-nav-ikon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Lagret</span>
    </button>
  </nav>

  <footer class="side-footer">
    <a href="/om/">Om påby</a>
    <span aria-hidden="true">·</span>
    <a href="/personvern/">Personvern</a>
    <span aria-hidden="true">·</span>
    <a href="mailto:axwoxen@gmail.com">axwoxen@gmail.com</a>
  </footer>

  <script type="module" src="js/main.js"></script>

</body>
</html>
