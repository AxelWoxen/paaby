<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn — Påby Admin</title>
  <link rel="icon" type="image/png" href="https://paaby.no/bilder/faviconAdmin.png?v=2" />
  <style>
    /* Helt selvstendig side — ingen eksterne skrifter/assets, slik at den
       fungerer uavhengig av alt annet (inkludert før innlogging). */
    :root {
      --hvit:  #FFFCF7;
      --svart: #1E0C14;
      --blaa:  #8CB1F4;
      --graa:  color-mix(in srgb, var(--svart) 55%, var(--hvit) 45%);
      --flate-2: color-mix(in srgb, var(--svart) 8%, var(--hvit) 92%);
      --faresone: #C4443B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--hvit); color: var(--svart);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .boks { width: 100%; max-width: 340px; }
    .logo { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.3rem; text-align: center; }
    .undertekst { color: var(--graa); font-size: 0.85rem; text-align: center; margin-bottom: 2rem; }
    .felt-gruppe { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; color: var(--graa); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
    input {
      width: 100%; background: var(--flate-2); border: 1.5px solid transparent;
      border-radius: 8px; padding: 0.65rem 0.8rem; font-size: 0.95rem; color: var(--svart);
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--blaa); }
    button {
      width: 100%; margin-top: 0.5rem; padding: 0.75rem; border: none; border-radius: 12px;
      background: var(--blaa); color: var(--svart); font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: 0.87; }
    .feilmelding {
      background: color-mix(in srgb, var(--faresone) 12%, var(--hvit) 88%);
      color: var(--faresone); border-radius: 8px; padding: 0.6rem 0.85rem;
      font-size: 0.85rem; margin-bottom: 1.25rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="boks">
    <p class="logo">Påby Admin</p>
    <p class="undertekst">Privat verktøy — kun for godkjente brukere</p>

    <p class="feilmelding" id="feilmelding" hidden></p>

    <form method="POST" action="/login">
      <div class="felt-gruppe">
        <label for="epost">E-post</label>
        <input type="email" id="epost" name="epost" autocomplete="username" required autofocus />
      </div>
      <div class="felt-gruppe">
        <label for="passord">Passord</label>
        <input type="password" id="passord" name="passord" autocomplete="current-password" required />
      </div>
      <button type="submit">Logg inn</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const feil = params.get('feil');
    if (feil) {
      const el = document.getElementById('feilmelding');
      el.hidden = false;
      el.textContent = feil === 'for-mange'
        ? 'For mange innloggingsforsøk. Prøv igjen om litt.'
        : 'Feil e-post eller passord.';
    }
  </script>
</body>
</html>
