<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn — Påby Admin</title>
  <link rel="icon" type="image/png" href="https://paaby.no/bilder/faviconAdmin.png?v=2" />
  <!-- Samme stilark som resten av panelet. De eneste unntakene i auth-
       gaten (se collector/review/auth/middleware.mjs) er admin.css,
       login.js og de tre fontfilene — alle eksakte stier, kun GET. -->
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-side">
    <div class="login-boks">
      <p class="login-logo">Påby Admin</p>
      <p class="login-undertekst">Privat verktøy — kun for godkjente brukere</p>

      <p class="login-feil" id="feilmelding" hidden></p>

      <form method="POST" action="/login">
        <div class="felt-gruppe">
          <label class="felt-label" for="epost">E-post</label>
          <input type="email" id="epost" name="epost" class="admin-input" autocomplete="username" required autofocus />
        </div>
        <div class="felt-gruppe">
          <label class="felt-label" for="passord">Passord</label>
          <input type="password" id="passord" name="passord" class="admin-input" autocomplete="current-password" required />
        </div>
        <button type="submit" class="skjema-submit">Logg inn</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
