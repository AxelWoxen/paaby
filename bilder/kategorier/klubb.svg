<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#141318"/>

  <!-- Høyttalerringer — konsentriske sirkler fra bunn-sentrum -->
  <circle cx="800" cy="1050" r="320"  fill="none" stroke="#28252F" stroke-width="28"/>
  <circle cx="800" cy="1050" r="480"  fill="none" stroke="#28252F" stroke-width="18"/>
  <circle cx="800" cy="1050" r="640"  fill="none" stroke="#1E1C24" stroke-width="14"/>
  <circle cx="800" cy="1050" r="800"  fill="none" stroke="#1E1C24" stroke-width="10"/>
  <circle cx="800" cy="1050" r="960"  fill="none" stroke="#1E1C24" stroke-width="6" opacity="0.6"/>
  <circle cx="800" cy="1050" r="1120" fill="none" stroke="#1E1C24" stroke-width="4" opacity="0.4"/>

  <!-- Lyskjegler fra topp -->
  <polygon points="800,0 560,900 800,900" fill="#FF4D5E" opacity="0.07"/>
  <polygon points="800,0 800,900 1040,900" fill="#C8FF4D" opacity="0.05"/>
  <polygon points="800,0 440,900 680,900"  fill="#FF4D5E" opacity="0.04"/>
  <polygon points="800,0 920,900 1160,900" fill="#C8FF4D" opacity="0.03"/>

  <!-- Lyskjegle-kanter -->
  <line x1="800" y1="0" x2="560"  y2="900" stroke="#FF4D5E" stroke-width="1.5" opacity="0.25"/>
  <line x1="800" y1="0" x2="1040" y2="900" stroke="#C8FF4D" stroke-width="1.5" opacity="0.2"/>
  <line x1="800" y1="0" x2="380"  y2="900" stroke="#FF4D5E" stroke-width="1"   opacity="0.12"/>
  <line x1="800" y1="0" x2="1220" y2="900" stroke="#C8FF4D" stroke-width="1"   opacity="0.10"/>

  <!-- Senter-høyttaler-membran -->
  <circle cx="800" cy="1050" r="140" fill="#1E1C24"/>
  <circle cx="800" cy="1050" r="90"  fill="#28252F"/>
  <circle cx="800" cy="1050" r="50"  fill="#FF4D5E" opacity="0.7"/>
  <circle cx="800" cy="1050" r="22"  fill="#141318"/>

  <!-- Dansegulv-prikker -->
  <rect x="640"  y="820" width="18" height="18" rx="3" fill="#C8FF4D" opacity="0.5"/>
  <rect x="700"  y="848" width="18" height="18" rx="3" fill="#FF4D5E" opacity="0.4"/>
  <rect x="760"  y="820" width="18" height="18" rx="3" fill="#F4F1EA" opacity="0.3"/>
  <rect x="820"  y="848" width="18" height="18" rx="3" fill="#C8FF4D" opacity="0.4"/>
  <rect x="880"  y="820" width="18" height="18" rx="3" fill="#FF4D5E" opacity="0.5"/>
  <rect x="940"  y="848" width="18" height="18" rx="3" fill="#F4F1EA" opacity="0.3"/>
</svg>
