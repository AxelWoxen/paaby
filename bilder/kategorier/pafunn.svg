<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#E9DDCF"/>

  <!-- Vimpelsnor i riso-duotone. Diagonal, asymmetrisk komposisjon —
       ujevn snorlengde og fallende sagging, flaggene henger i litt ulik
       vinkel som om de faktisk henger i vind. Aksentflagget (lime) har
       samme forskjøvne trykk-spøkelse som platen/sitrusen, og bærer
       eneste halvtone-teksturen — resten holdes flatt og rolig. -->

  <path d="M80,170 C560,420 1040,420 1520,150" fill="none" stroke="#3C3C34" stroke-width="4" opacity="0.5"/>

  <!-- Flagg 1: outline -->
  <path d="M152.3,230.2 L237.7,219.8 L210.8,354.0 Z" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.55"/>
  <!-- Flagg 2: outline -->
  <path d="M379.2,302.9 L472.8,311.1 L413.6,448.5 Z" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.55"/>
  <!-- Flagg 3: solid -->
  <path d="M611.1,352.1 L700.9,345.9 L665.5,484.7 Z" fill="#3C3C34" opacity="0.85"/>

  <!-- Flagg 4: aksent — misregistration-spøkelse bak, halvtone-tekstur, ren lime foran -->
  <path d="M800.3,342.8 L899.7,353.2 L834.3,497.2 Z" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.4"/>
  <path d="M793.3,348.8 L892.7,359.2 L827.3,503.2 Z" fill="#CEFB94"/>
  <circle cx="839.2" cy="413.2" r="3.4" fill="#3C3C34" opacity="0.30"/>
  <circle cx="840.3" cy="409.5" r="3.2" fill="#3C3C34" opacity="0.30"/>
  <circle cx="817.8" cy="409.8" r="3.2" fill="#3C3C34" opacity="0.30"/>
  <circle cx="866.4" cy="380.6" r="3.5" fill="#3C3C34" opacity="0.38"/>
  <circle cx="810.3" cy="430.7" r="2.9" fill="#3C3C34" opacity="0.26"/>
  <circle cx="806.4" cy="442.8" r="2.9" fill="#3C3C34" opacity="0.22"/>
  <circle cx="855.3" cy="417.1" r="2.6" fill="#3C3C34" opacity="0.28"/>
  <circle cx="804.2" cy="411.0" r="2.6" fill="#3C3C34" opacity="0.30"/>
  <circle cx="818.2" cy="390.9" r="3.0" fill="#3C3C34" opacity="0.35"/>

  <!-- Flagg 5: outline -->
  <path d="M986.2,336.8 L1073.8,329.2 L1041.5,464.5 Z" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.55"/>
  <!-- Flagg 6: solid -->
  <path d="M1186.1,277.6 L1277.9,282.4 L1224.8,417.8 Z" fill="#3C3C34" opacity="0.85"/>
  <!-- Flagg 7: outline -->
  <path d="M1392.2,200.4 L1475.8,191.6 L1447.2,321.3 Z" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.55"/>

  <!-- Konfetti — restraint, i den åpne nedre flaten -->
  <circle cx="300" cy="620" r="7" fill="#3C3C34" opacity="0.28"/>
  <rect x="1190" y="643" width="20" height="7" rx="3.5" fill="#CEFB94" opacity="0.55" transform="rotate(24 1200 646)"/>
  <path d="M970,690 l16,0 l-8,15 Z" fill="#3C3C34" opacity="0.22"/>
  <circle cx="500" cy="715" r="5" fill="#CEFB94" opacity="0.5"/>
  <rect x="1350" y="595" width="18" height="6" rx="3" fill="#3C3C34" opacity="0.22" transform="rotate(-18 1359 598)"/>
</svg>
