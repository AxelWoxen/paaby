<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#141318"/>

  <!-- Tallerkenen: stor sirkel -->
  <circle cx="800" cy="530" r="280" fill="#1E1C24"/>
  <circle cx="800" cy="530" r="280" fill="none" stroke="#28252F" stroke-width="24"/>
  <circle cx="800" cy="530" r="230" fill="none" stroke="#28252F" stroke-width="1.5" opacity="0.6"/>

  <!-- Dampen — tre bølgete linjer i korall -->
  <path d="M720,340 C730,300 710,270 720,230 C730,190 710,165 720,125"
