  <!-- Bestikk: gaffel venstre -->
  <rect x="480" y="330" width="8" height="220" rx="4" fill="#9994A2" opacity="0.5"/>
  <rect x="468" y="330" width="8" height="80"  rx="4" fill="#9994A2" opacity="0.5"/>
  <rect x="492" y="330" width="8" height="80"  rx="4" fill="#9994A2" opacity="0.5"/>

  <!-- Bestikk: kniv høyre -->
  <rect x="1112" y="330" width="8" height="220" rx="4" fill="#9994A2" opacity="0.5"/>
  <path d="M1112,330 Q1120,350 1120,380 L1112,380Z" fill="#9994A2" opacity="0.5"/>

  <!-- Lime-aksent: liten prikk i sentrum -->
  <circle cx="800" cy="530" r="14" fill="#C8FF4D" opacity="0.6"/>
  <circle cx="800" cy="530" r="6"  fill="#141318"/>

  <!-- Subtile aksentprikker rundt tallerken -->
  <circle cx="560" cy="480" r="4" fill="#C8FF4D" opacity="0.3"/>
  <circle cx="1040" cy="480" r="4" fill="#C8FF4D" opacity="0.3"/>
  <circle cx="780" cy="760" r="4" fill="#FF4D5E" opacity="0.3"/>
