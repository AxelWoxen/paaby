<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#E9DDCF"/>

  <!-- Sitrushalvdel i riso-duotone: flate former, ingen gradient.
       Skallet har en bevisst fargeforskyvning ("misregistration") —
       en tynn lime-kant aner bak den mørke ringen, som om trykket
       bommet et par millimeter. Én båt er flatt limefarget aksent,
       én er skyggelagt med håndsatte halvtone-prikker i stedet for
       gradient. Sirkelen bløder ut av rammen nederst — bevisst
       beskjæring, ikke et uhell. -->

  <!-- Misregistration: lime-ring bak skallet -->
  <circle cx="607" cy="526" r="344" fill="#CEFB94"/>

  <!-- Skallet -->
  <circle cx="600" cy="520" r="340" fill="#3C3C34"/>
  <circle cx="600" cy="520" r="296" fill="#E9DDCF"/>

  <!-- Den hvite margen — antydet, ikke tegnet -->
  <circle cx="600" cy="520" r="286" fill="none" stroke="#3C3C34" stroke-width="2" opacity="0.22"/>

  <!-- Fruktkjøttets ytterkant -->
  <circle cx="600" cy="520" r="256" fill="none" stroke="#3C3C34" stroke-width="3" opacity="0.5"/>

  <!-- Båtdelere — ujevnt fordelt, som et ekte kutt -->
  <line x1="600" y1="520" x2="856.0" y2="520.0" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="796.1" y2="684.6" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="591.1" y2="775.8" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="378.3" y2="648.0" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="352.7" y2="453.7" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="472.0" y2="298.3" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="644.5" y2="267.9" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>
  <line x1="600" y1="520" x2="821.7" y2="392.0" stroke="#3C3C34" stroke-width="2.5" opacity="0.42"/>

  <!-- Skyggelagt båt (halvtone-tekstur, ingen gradient) -->
  <path d="M600,520 L591.1,775.8 A256,256 0 0,1 378.3,648.0 Z" fill="#3C3C34" opacity="0.10"/>
  <circle cx="487.9" cy="665.3" r="4.1" fill="#3C3C34" opacity="0.48"/>
  <circle cx="450.1" cy="675.5" r="2.1" fill="#3C3C34" opacity="0.35"/>
  <circle cx="463.5" cy="615.8" r="4.3" fill="#3C3C34" opacity="0.25"/>
  <circle cx="553.8" cy="602.3" r="3.4" fill="#3C3C34" opacity="0.38"/>
  <circle cx="592.7" cy="608.7" r="2.7" fill="#3C3C34" opacity="0.48"/>
  <circle cx="544.0" cy="575.3" r="4.1" fill="#3C3C34" opacity="0.26"/>
  <circle cx="555.8" cy="577.9" r="2.0" fill="#3C3C34" opacity="0.46"/>
  <circle cx="576.6" cy="605.6" r="4.6" fill="#3C3C34" opacity="0.46"/>
  <circle cx="525.1" cy="730.1" r="3.4" fill="#3C3C34" opacity="0.41"/>
  <circle cx="543.0" cy="731.8" r="3.8" fill="#3C3C34" opacity="0.49"/>
  <circle cx="517.9" cy="583.5" r="2.9" fill="#3C3C34" opacity="0.27"/>
  <circle cx="587.3" cy="580.4" r="2.8" fill="#3C3C34" opacity="0.39"/>
  <circle cx="587.5" cy="691.6" r="2.9" fill="#3C3C34" opacity="0.31"/>

  <!-- Aksent-båten: lime, flat — misregistration-spøkelse bak, ren farge foran -->
  <path d="M607,515 L651.5,262.9 A256,256 0 0,1 828.7,387.0 Z" fill="none" stroke="#3C3C34" stroke-width="2.5" opacity="0.35"/>
  <path d="M600,520 L644.5,267.9 A256,256 0 0,1 821.7,392.0 Z" fill="#CEFB94"/>

  <!-- Kjerner -->
  <ellipse cx="741.0" cy="571.3" rx="10" ry="16" fill="#3C3C34" opacity="0.55" transform="rotate(15 741.0 571.3)"/>
  <ellipse cx="462.1" cy="544.3" rx="10" ry="16" fill="#3C3C34" opacity="0.55" transform="rotate(-25 462.1 544.3)"/>
  <ellipse cx="460.7" cy="422.5" rx="10" ry="16" fill="#3C3C34" opacity="0.55" transform="rotate(40 460.7 422.5)"/>

  <!-- Satellitt-detaljer i den åpne høyre flaten — holder komposisjonen i balanse -->
  <circle cx="1180" cy="330" r="6" fill="#3C3C34" opacity="0.22"/>
  <circle cx="1300" cy="480" r="4" fill="#3C3C34" opacity="0.18"/>
  <circle cx="1220" cy="620" r="5" fill="#CEFB94" opacity="0.55"/>
</svg>
