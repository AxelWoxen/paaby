<!-- OG-bilde 1200×630. For produksjon: konverter til PNG og bruk absolutt URL i og:image.
     Se index.html — to felt må oppdateres ved deployment: og:url og og:image. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#141318"/>

  <!-- Korall-pin -->
  <path transform="translate(540 100) scale(10)"
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
        fill="#FF4D5E"/>

  <!-- Navn -->
  <text x="600" y="355"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="110" font-weight="700" fill="#F4F1EA"
        text-anchor="middle" letter-spacing="-2">påby</text>

  <!-- Tagline -->
  <text x="600" y="430"
        font-family="'Inter', Arial, sans-serif"
        font-size="30" fill="#9994A2"
        text-anchor="middle">Håndplukkede ting å gjøre i Oslo</text>
</svg>
