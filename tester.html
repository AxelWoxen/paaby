<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Påby — tester</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px 80px;
      background: #151318;
      color: #eee9e4;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      line-height: 1.5;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      color: #aaa4ad;
      margin-bottom: 32px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #39343f;
      font-size: 18px;
    }

    pre {
      margin: 6px 0;
      padding: 9px 12px;
      border-radius: 7px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ok {
      background: #16271d;
      color: #9ee2ad;
    }

    .feil {
      background: #30191d;
      color: #ff9fa8;
    }

    #oppsummering {
      margin-top: 40px;
      padding: 18px;
      border-radius: 8px;
      background: #211e25;
      font-size: 17px;
      font-weight: 700;
    }

    #oppsummering.alt-ok {
      color: #baff91;
    }

    #oppsummering.har-feil {
      color: #ff9fa8;
    }
  </style>
</head>

<body>
  <main>
    <h1>Påby — testresultater</h1>

    <p class="intro">
      Tester dagens API-, validerings- og applikasjonslogikk.
    </p>

    <div id="ut"></div>
    <div id="oppsummering">Kjører tester…</div>
  </main>

  <script type="module">
    import {
  validerEventer,
  erGyldigUrl,
} from './js/application/validering.js';

import {
  erIHelga,
} from './js/application/filtre.js';

import {
  skjulPasserte,
} from './js/application/gruppering.js';
import {
  osloKomponenter,
} from './js/application/oslo-tid.js';

    import {
      KATEGORI_BILDER,
      hentEventbilde,
    } from './js/application/kategori-bilder.js';

    import {
      kalkulerAvstand,
      erGyldigeKoordinater,
    } from './js/application/posisjon.js';

    import {
      sorterEventer,
    } from './js/application/sortering.js';

    import {
      formaterAvstand,
      kategoriVisningsnavn,
    } from './js/application/formatering.js';

    import {
      ukeMandag,
      ukeVindu,
      filtrerTilUke,
      ukeLabel,
    } from './js/application/uke.js';

    import {
      hentEventer,
    } from './js/network/events-api.js';


    /* ─────────────────────────────────────
       Last data fra samme API som Påby
       ───────────────────────────────────── */

    let EVENTER = [];

    try {
      EVENTER = await hentEventer();
    } catch (err) {
      console.error('Kunne ikke hente events:', err);
    }


    /* ─────────────────────────────────────
       Mini-testrammeverk
       ───────────────────────────────────── */

    let bestått = 0;
    let feilet = 0;

    const ut = document.getElementById('ut');
    const oppsummering = document.getElementById('oppsummering');


    function gruppe(navn) {
      const h = document.createElement('h2');
      h.textContent = navn;
      ut.appendChild(h);
    }


    function test(beskrivelse, faktisk, forventet) {
      const ok =
        JSON.stringify(faktisk) ===
        JSON.stringify(forventet);

      const div = document.createElement('pre');

      if (ok) {
        bestått++;
        div.className = 'ok';
        div.textContent = `✓ ${beskrivelse}`;
      } else {
        feilet++;
        div.className = 'feil';

        div.textContent =
          `✗ ${beskrivelse}\n` +
          `  forventet: ${JSON.stringify(forventet)}\n` +
          `  fikk:      ${JSON.stringify(faktisk)}`;
      }

      ut.appendChild(div);
    }


    function testTrue(beskrivelse, verdi) {
      test(beskrivelse, Boolean(verdi), true);
    }


    function testFalse(beskrivelse, verdi) {
      test(beskrivelse, Boolean(verdi), false);
    }


    /* ─────────────────────────────────────
       Basis-event brukt i enhetstester
       ───────────────────────────────────── */

    const GYLDIG = {
      id: 'test-event',
      tittel: 'Testevent',
      kategori: 'musikk',

      sted: 'BLÅ',
      adresse: 'Brenneriveien 9C, Oslo',

      lat: 59.9207,
      lng: 10.7521,

      start: '2026-07-20T20:00:00+02:00',
      slutt: '2026-07-20T22:00:00+02:00',

      pris: 150,
      prisTekst: '150 kr',

      beskrivelse: 'Test',
      kuratortekst: null,

      lenke: 'https://example.com',
      bilde: null,

      fremhevet: false,
    };


    /* ══════════════════════════════════════
       1. DATAVALIDERING
       ══════════════════════════════════════ */

    gruppe('1. Datavalidering');

    test(
      'gyldig arrangement godtas',
      validerEventer([GYLDIG]).length,
      1,
    );


    test(
      'manglende id avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: undefined,
        },
      ]).length,
      0,
    );


    test(
      'duplikat id avvises',
      validerEventer([
        GYLDIG,
        { ...GYLDIG },
      ]).length,
      1,
    );


    test(
      'ugyldig kategori avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: 'ugyldig-kategori',
          kategori: 'sport',
        },
      ]).length,
      0,
    );


    test(
      'manglende start avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: 'uten-start',
          start: null,
        },
      ]).length,
      0,
    );


    test(
      'start uten tidssone avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: 'uten-timezone',
          start: '2026-07-20T20:00:00',
        },
      ]).length,
      0,
    );


    test(
      'start med Z godtas',
      validerEventer([
        {
          ...GYLDIG,
          id: 'utc-start',
          start: '2026-07-20T18:00:00Z',
        },
      ]).length,
      1,
    );


    test(
      'slutt før start avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: 'feil-slutt',
          slutt: '2026-07-20T18:00:00+02:00',
        },
      ]).length,
      0,
    );


    test(
      'negativ pris avvises',
      validerEventer([
        {
          ...GYLDIG,
          id: 'negativ-pris',
          pris: -1,
        },
      ]).length,
      0,
    );


    test(
      'pris null godtas',
      validerEventer([
        {
          ...GYLDIG,
          id: 'ukjent-pris',
          pris: null,
        },
      ]).length,
      1,
    );


    const nullKoord = {
      ...GYLDIG,
      id: 'null-koord',
      lat: null,
      lng: null,
    };

    test(
      'null-koordinater godtas parvis',
      validerEventer([nullKoord]).length,
      1,
    );


    const enKoord = {
      ...GYLDIG,
      id: 'en-koord',
      lat: 59.9,
      lng: null,
    };

    test(
      'lat uten lng avvises',
      validerEventer([enKoord]).length,
      0,
    );


    /* ══════════════════════════════════════
       2. URL-VALIDERING
       ══════════════════════════════════════ */

    gruppe('2. URL-validering');

    testTrue(
      'https: godtas',
      erGyldigUrl('https://example.com'),
    );

    testTrue(
      'http: godtas',
      erGyldigUrl('http://example.com'),
    );

    testFalse(
      'javascript: avvises',
      erGyldigUrl('javascript:alert(1)'),
    );

    testFalse(
      'data: avvises',
      erGyldigUrl('data:text/html,test'),
    );

    testFalse(
      'tom streng avvises',
      erGyldigUrl(''),
    );

    testFalse(
      'null avvises',
      erGyldigUrl(null),
    );

    testFalse(
      'ugyldig URL avvises',
      erGyldigUrl('ikke-en-url'),
    );


    /* ══════════════════════════════════════
       3. PASSERTE ARRANGEMENTER
       ══════════════════════════════════════ */

    gruppe('3. Passerte arrangementer');

    const nå =
      new Date('2026-07-18T15:00:00+02:00');


    const fremtidig = {
      ...GYLDIG,
      id: 'passert-0',
      start: '2026-07-18T20:00:00+02:00',
    };


    const pågående = {
      ...GYLDIG,
      id: 'passert-1',
      start: '2026-07-18T14:30:00+02:00',
      slutt: '2026-07-18T17:00:00+02:00',
    };


    const avsluttet = {
      ...GYLDIG,
      id: 'passert-2',
      start: '2026-07-18T10:00:00+02:00',
      slutt: '2026-07-18T13:00:00+02:00',
    };


    const ingenSlutt = {
      ...GYLDIG,
      id: 'passert-3',
      start: '2026-07-18T10:00:00+02:00',
      slutt: null,
    };


    const ingenSlutt2 = {
      ...GYLDIG,
      id: 'passert-4',
      start: '2026-07-18T13:00:00+02:00',
      slutt: null,
    };


    testTrue(
      'fremtidig vises',
      skjulPasserte(
        [fremtidig],
        nå,
      ).length === 1,
    );


    testTrue(
      'pågående vises',
      skjulPasserte(
        [pågående],
        nå,
      ).length === 1,
    );


    /*
     * Disse to testene beholdes med vilje.
     *
     * Dersom de feiler, skal vi undersøke skjulPasserte()
     * i stedet for å endre forventningen bare for å gjøre
     * testen grønn.
     */

   testTrue(
  'avsluttet event beholdes ut kalenderdagen',
  skjulPasserte([avsluttet], nå).length === 1,
);

testTrue(
  'event uten slutt beholdes ut kalenderdagen',
  skjulPasserte([ingenSlutt], nå).length === 1,
);


    testTrue(
      'event 2t gammelt uten slutt vises',
      skjulPasserte(
        [ingenSlutt2],
        nå,
      ).length === 1,
    );


    /* ══════════════════════════════════════
       4. HELGELOGIKK
       ══════════════════════════════════════ */

    gruppe('4. Helgelogikk');

    const mandag =
      new Date('2026-07-13T10:00:00+02:00');

    const torsdag =
      new Date('2026-07-16T22:00:00+02:00');

    const fredagFør =
      new Date('2026-07-17T15:59:00+02:00');

    const fredagEtter =
      new Date('2026-07-17T16:01:00+02:00');

    const lørdag =
      new Date('2026-07-18T14:00:00+02:00');

    const søndag =
      new Date('2026-07-19T10:00:00+02:00');


    const fredagEvent =
      new Date('2026-07-17T18:00:00+02:00');

    const lørdagEvent =
      new Date('2026-07-18T20:00:00+02:00');

    const mandagEvent =
      new Date('2026-07-20T10:00:00+02:00');


    testTrue(
      'mandag: fredag i kommende helg',
      erIHelga(
        fredagEvent,
        mandag,
      ),
    );


    testTrue(
      'mandag: lørdag i kommende helg',
      erIHelga(
        lørdagEvent,
        mandag,
      ),
    );


    testFalse(
      'mandag-event er ikke helg',
      erIHelga(
        mandagEvent,
        mandag,
      ),
    );


    testTrue(
      'torsdag: kommende lørdag er helg',
      erIHelga(
        lørdagEvent,
        torsdag,
      ),
    );


    /*
     * Beholdes som potensiell regresjonstest.
     * Hvis den feiler undersøker vi erIHelga().
     */

    testTrue(
  'fredag 15:59: kveldens event tilhører kommende helg',
  erIHelga(fredagEvent, fredagFør),
);


    testTrue(
      'fredag 16:01: helgen har startet',
      erIHelga(
        fredagEvent,
        fredagEtter,
      ),
    );


    testTrue(
      'lørdag: lørdag-event er helg',
      erIHelga(
        lørdagEvent,
        lørdag,
      ),
    );


    testFalse(
      'lørdag: mandag-event er ikke helg',
      erIHelga(
        mandagEvent,
        lørdag,
      ),
    );


    testTrue(
      'søndag: lørdag-event tilhører helgen',
      erIHelga(
        lørdagEvent,
        søndag,
      ),
    );


    /* ══════════════════════════════════════
       5. KATEGORIER OG STANDARD-BILDER
       ══════════════════════════════════════ */

    gruppe('5. Kategorier og bilder');


    test(
      'musikk har JPG-standardbilde',
      KATEGORI_BILDER.musikk.endsWith(
        'musikk.jpg',
      ),
      true,
    );


    test(
      'klubb har JPG-standardbilde',
      KATEGORI_BILDER.klubb.endsWith(
        'klubb.jpg',
      ),
      true,
    );


    test(
      'pafunn har JPG-standardbilde',
      KATEGORI_BILDER.pafunn.endsWith(
        'pafunn.jpg',
      ),
      true,
    );


    test(
      'visningsnavn musikk',
      kategoriVisningsnavn('musikk'),
      'Musikk',
    );


    test(
      'visningsnavn klubb',
      kategoriVisningsnavn('klubb'),
      'Klubb',
    );


    test(
      'visningsnavn pafunn',
      kategoriVisningsnavn('pafunn'),
      'Påfunn',
    );


    const utenBilde = {
      ...GYLDIG,
      bilde: null,
    };


    test(
      'event uten bilde får kategoribilde',
      hentEventbilde(utenBilde),
      KATEGORI_BILDER.musikk,
    );


    test(
      'event med eget bilde beholder det',
      hentEventbilde({
        ...GYLDIG,
        bilde: 'https://example.com/bilde.jpg',
      }),
      'https://example.com/bilde.jpg',
    );


    test(
      'tom bildestreng bruker fallback',
      hentEventbilde({
        ...GYLDIG,
        bilde: '',
      }),
      KATEGORI_BILDER.musikk,
    );


    /* ══════════════════════════════════════
       6. KOORDINATER OG AVSTAND
       ══════════════════════════════════════ */

    gruppe('6. Koordinater og avstand');


    testTrue(
  'gyldige Oslo-koordinater',
  erGyldigeKoordinater({
    lat: 59.9139,
    lng: 10.7522,
  }),
);


    testFalse(
  'latitude 91 er ugyldig',
  erGyldigeKoordinater({
    lat: 91,
    lng: 10.75,
  }),
);


    testFalse(
  'null-koordinater er ugyldige for avstandsberegning',
  erGyldigeKoordinater(null),
);


    const sammeSted =
  kalkulerAvstand(
    {
      lat: 59.9139,
      lng: 10.7522,
    },
    {
      lat: 59.9139,
      lng: 10.7522,
    },
  );


    testTrue(
      'samme koordinat ≈ 0 km',
      sammeSted !== null &&
      Math.abs(sammeSted) < 0.001,
    );


    test(
      'null avstand formatteres tomt',
      formaterAvstand(null),
      '',
    );


    test(
      '0 km formatteres som under 100 m',
      formaterAvstand(0),
      'under 100 m unna',
    );


    test(
      '1 km formatteres riktig',
      formaterAvstand(1),
      '1 km unna',
    );


    /* ══════════════════════════════════════
       7. SORTERING
       ══════════════════════════════════════ */

    gruppe('7. Sortering');


    const sortTest = [
      {
        ...GYLDIG,
        id: 'sort-c',
        tittel: 'C',
        start: '2026-07-22T20:00:00+02:00',
        pris: 350,
      },
      {
        ...GYLDIG,
        id: 'sort-a',
        tittel: 'A',
        start: '2026-07-20T20:00:00+02:00',
        pris: 0,
      },
      {
        ...GYLDIG,
        id: 'sort-b',
        tittel: 'B',
        start: '2026-07-21T20:00:00+02:00',
        pris: 150,
      },
    ];


    test(
      'tid-stigende sorterer A → B → C',
      sorterEventer(
        sortTest,
        'tid-stigende',
      ).map((e) => e.tittel),
      ['A', 'B', 'C'],
    );


    test(
      'tid-synkende sorterer C → B → A',
      sorterEventer(
        sortTest,
        'tid-synkende',
      ).map((e) => e.tittel),
      ['C', 'B', 'A'],
    );


    test(
      'pris-stigende sorterer 0 → 150 → 350',
      sorterEventer(
        sortTest,
        'pris-stigende',
      ).map((e) => e.pris),
      [0, 150, 350],
    );


    test(
      'sortering muterer ikke original-array',
      sortTest.map((e) => e.tittel),
      ['C', 'A', 'B'],
    );


    /* ══════════════════════════════════════
   8. UKE-NAVIGERING
   ══════════════════════════════════════ */

gruppe('8. Uke-navigering');

const ukeReferanse =
  new Date('2026-07-22T12:00:00+02:00');

const mandagDenneUka =
  ukeMandag(ukeReferanse);

test(
  'mandag denne uka er 20. juli',
  osloKomponenter(mandagDenneUka).dag,
  20,
);

const {
  fra: denneUkaFra,
  til: denneUkaTil,
} = ukeVindu(mandagDenneUka, 0);

const ukeTestEventer = [
  {
    ...GYLDIG,
    id: 'uke-1',
    start: '2026-07-20T20:00:00+02:00',
  },
  {
    ...GYLDIG,
    id: 'uke-2',
    start: '2026-07-27T20:00:00+02:00',
  },
];

test(
  'filtrerTilUke inkluderer kun event i uka',
  filtrerTilUke(
    ukeTestEventer,
    denneUkaFra,
    denneUkaTil,
  ).length,
  1,
);

test(
  'ukeLabel for denne uka',
  ukeLabel(mandagDenneUka, 0),
  'Denne uka',
);

testTrue(
  'ukeLabel for neste uke returnerer uke-label',
  ukeLabel(
    mandagDenneUka,
    1,
  ).startsWith('Uke '),
);

    /* ══════════════════════════════════════
       9. API-DATA
       ══════════════════════════════════════ */

    gruppe('9. API-data');


    testTrue(
      'API returnerer minst ett arrangement',
      EVENTER.length > 0,
    );


    const gyldige =
      validerEventer(EVENTER);


    testTrue(
      'API inneholder gyldige arrangementer',
      gyldige.length > 0,
    );


    const idListe =
      gyldige.map((event) => event.id);


    test(
      'alle returnerte ID-er er unike',
      new Set(idListe).size,
      idListe.length,
    );


    testTrue(
      'alle kategorier er støttet',
      gyldige.every((event) =>
        [
          'musikk',
          'klubb',
          'pafunn',
        ].includes(event.kategori)
      ),
    );


    testTrue(
      'alle starttidspunkt kan parses',
      gyldige.every((event) =>
        !Number.isNaN(
          new Date(event.start).getTime(),
        )
      ),
    );


    testTrue(
      'alle starttidspunkt har eksplisitt tidssone',
      gyldige.every((event) =>
        /(?:Z|[+-]\d{2}:\d{2})$/.test(
          event.start,
        )
      ),
    );


    testTrue(
      'koordinater er begge satt eller begge null',
      gyldige.every((event) =>
        (
          event.lat == null &&
          event.lng == null
        ) ||
        (
          event.lat != null &&
          event.lng != null
        )
      ),
    );


    testTrue(
      'kjent pris er aldri negativ',
      gyldige.every((event) =>
        event.pris === null ||
        event.pris >= 0
      ),
    );


    testTrue(
      'eventlenker er HTTP(S) eller null',
      gyldige.every((event) =>
        event.lenke == null ||
        event.lenke.startsWith('https://') ||
        event.lenke.startsWith('http://')
      ),
    );


    testTrue(
      'API-data inneholder ikke gamle mat-kategorien',
      gyldige.every(
        (event) =>
          event.kategori !== 'mat',
      ),
    );


    /* ─────────────────────────────────────
       Oppsummering
       ───────────────────────────────────── */

    const totalt =
      bestått + feilet;


    if (feilet === 0) {
      oppsummering.className = 'alt-ok';

      oppsummering.textContent =
        `✓ Alle ${totalt} tester bestod`;
    } else {
      oppsummering.className = 'har-feil';

      oppsummering.textContent =
        `✗ ${feilet} av ${totalt} tester feilet`;
    }
  </script>
</body>
</html>
